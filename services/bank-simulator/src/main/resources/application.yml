# Settings specific to bank-simulator. Shared monitoring, logging and error-handling
# defaults come from config/global/monitoring.yml; only override what differs.
# Settings that operators change at runtime belong in the management console.
spring:
  application:
    name: bank-simulator

server:
  port: ${SERVER_PORT:8103}

platform:
  domain: payments

# Local SNAP BI bank for development and tests. Never deploy outside local/test.
# Keys are generated by services/bank-simulator/dev/dev-keys.sh (not committed).
simulator:
  prefix: /bni
  slow-delay: ${SIMULATOR_SLOW_DELAY:35s}
  partner:
    client-key: ${BNI_CLIENT_KEY:}
    client-secret: ${BNI_CLIENT_SECRET:}
    public-key: ${SIMULATOR_PARTNER_PUBLIC_KEY:}
  callback:
    gateway-url: ${SIMULATOR_GATEWAY_URL:http://localhost:8102/inbound/bni}
    client-key: ${BNI_INBOUND_CLIENT_KEY:}
    client-secret: ${BNI_INBOUND_CLIENT_SECRET:}
    private-key: ${SIMULATOR_BANK_PRIVATE_KEY:}
