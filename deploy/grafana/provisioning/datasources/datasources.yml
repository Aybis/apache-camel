apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        # Click a correlation ID in any log line to see that message across all services.
        - name: correlationId
          matcherRegex: '"correlationId":"([^"]+)"'
          url: '{service=~".+"} |= `$${__value.raw}`'
          datasourceUid: loki
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
