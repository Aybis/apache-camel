# Local stack: observability (Loki, Prometheus, Alloy, Grafana), PostgreSQL + console.
# Services come from the generated docker-compose.services.yml. Use scripts/stack.sh.
name: camel-platform

services:
  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.1
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      # Local only: anonymous read access so the console can embed dashboards.
      # Replace with SSO (OIDC/LDAP) before any shared environment.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/camel-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

  postgres:
    # PostgreSQL 18 (platform database convention: one database + role per service, see CLAUDE.md).
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # One-shot: creates missing per-service databases and roles from config/services.yml, then exits.
  db-provision:
    image: postgres:18.6-alpine
    entrypoint: ["sh", "/provision.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-local-dev-only}
    volumes:
      - ./postgres/provision.sh:/provision.sh:ro
      - ../config/services.yml:/config/services.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  console:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.console
    image: camel-platform/console:local
    labels:
      camel.platform.service: "console"
      camel.platform.domain: "platform"
    environment:
      SERVER_PORT: "8090"
      PLATFORM_ENV: local
      CONSOLE_DATA_DIR: /data
      CONSOLE_REGISTRY: /config/services.yml
      LOKI_URL: http://loki:3100
      # Browser-facing URL (the console page links and embeds it).
      GRAFANA_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
      CONSOLE_WRITE_TOKEN: ${CONSOLE_WRITE_TOKEN:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/console
      SPRING_DATASOURCE_USERNAME: console
      SPRING_DATASOURCE_PASSWORD: ${SERVICE_DB_PASSWORD:-local-dev-only}
    volumes:
      - ../config/services.yml:/config/services.yml:ro
      - console-data:/data
    ports:
      - "8090:8090"
    depends_on:
      loki:
        condition: service_started
      db-provision:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  loki-data:
  prometheus-data:
  grafana-data:
  console-data:
  postgres-data:
