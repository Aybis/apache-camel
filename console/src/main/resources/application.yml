spring:
  application:
    name: console

  # Platform database convention: one database and role per service, credentials only from the
  # environment. The defaults below match the local Docker stack (scripts/stack.sh) and nothing else.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/console}
    username: ${SPRING_DATASOURCE_USERNAME:console}
    # Password only from SPRING_DATASOURCE_PASSWORD (environment), never from this file.
    hikari:
      maximum-pool-size: 5
  flyway:
    # Schema is owned by this service: src/main/resources/db/migration
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful

console:
  # Legacy file store from before PostgreSQL. If store.json / audit.jsonl exist here and the database
  # is empty, they are imported once at start-up.
  data-dir: ${CONSOLE_DATA_DIR:./data}
  # Service registry maintained by scripts/new-service.sh.
  registry: ${CONSOLE_REGISTRY:../config/services.yml}
  loki-url: ${LOKI_URL:http://localhost:3100}
  # Browser-facing Grafana URL, used for links and the embedded dashboard.
  grafana-url: ${GRAFANA_URL:http://localhost:3000}
  dashboard-uid: camel-service
  # A service is STALE when no heartbeat arrived within this window.
  stale-after: 60s
  # When set, changes require the X-Console-Token header. Leave empty only on a laptop.
  write-token: ${CONSOLE_WRITE_TOKEN:}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: console
        environment: ${PLATFORM_ENV:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
